<script>
// Darstellung nach Tageszeit: zwischen Ende und Beginn der bürgerlichen Dämmerung (Sonne 6° unter dem Horizont,
// berechnet für die Mitte von Rheinland-Pfalz) dunkel, tagsüber wie im Gerät eingestellt.
window.nachtModus = () => {
  const jetzt = new Date(), rad = Math.PI / 180, breite = 49.9, laenge = 7.4;
  const n = Math.floor((jetzt - Date.UTC(jetzt.getUTCFullYear(), 0, 0)) / 864e5);
  const dekl = -23.44 * Math.cos(2 * Math.PI / 365 * (n + 10)) * rad;
  const B = 2 * Math.PI * (n - 81) / 364, zeitgl = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  const mittag = 12 - laenge / 15 - zeitgl / 60;
  const h0 = Math.acos((Math.sin(-6 * rad) - Math.sin(breite * rad) * Math.sin(dekl)) / (Math.cos(breite * rad) * Math.cos(dekl))) / rad / 15;
  const t = jetzt.getUTCHours() + jetzt.getUTCMinutes() / 60;
  const nacht = t < mittag - h0 || t > mittag + h0;
  if (nacht) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
  return nacht;
};
nachtModus();
</script>

.sitzliste .kopf > span { border-top: 0; font-size: 12px; color: var(--muted); padding-top: 0; }
.sitzliste .zeile.aktiv > span { background: var(--accent-soft); }
.sitzliste .zeile > span:first-child { display: flex; gap: 8px; align-items: flex-start; min-width: 0; overflow-wrap: break-word; hyphens: auto; }
.sitzliste i { flex: none; width: 12px; height: 12px; border-radius: 3px; background: var(--c); margin-top: .3em; }

:root[data-theme="dark"] .sitz path, :root[data-theme="dark"] .sitzliste i, :root[data-theme="dark"] .sitz-kurz i { fill: var(--cd); background: var(--cd); }
/* Textseiten (Über, Impressum, Datenschutz) im Reiter „Info“ */
.textseite { padding: 16px 18px; display: grid; gap: 10px; line-height: 1.6; }

.textseite p { margin: 0; overflow-wrap: anywhere; }
.textseite .lead { font-size: 16px; }
.spende { padding: 16px 18px; display: grid; gap: 10px; line-height: 1.55; margin-top: 14px; border-color: var(--accent); }
.spende h4 { margin: 0; font-size: 17px; color: var(--accent); }
.spende p { margin: 0; }
.spende .spendenknopf { display: block; text-align: center; text-decoration: none; padding: 13px 16px; }
.textseite .fehlt { color: var(--warn); background: var(--warn-soft); padding: 0 4px; border-radius: 4px; }
.offline { background: var(--warn-soft); color: var(--warn); font-size: 13px; padding: 6px 16px; text-align: center; }
.banner { position: relative; margin: 0; border-radius: 16px; overflow: hidden; background: var(--surface); box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 6px 18px rgba(60,20,30,.10); }
.bn-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.bn-track::-webkit-scrollbar { display: none; }
.bn-slide { display: block; color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; flex: 0 0 100%; margin: 0; position: relative; scroll-snap-align: start; aspect-ratio: 9 / 4; }
.bn-slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.bn-slide::after { content: ""; position: absolute; inset: auto 0 0 0; height: 46%; background: linear-gradient(0deg, rgba(30,10,16,.55), transparent); pointer-events: none; }
.bn-slide .bn-cap { z-index: 1; position: absolute; left: 12px; bottom: 12px; right: 70px; padding: 5px 10px; border-radius: 999px; width: fit-content; max-width: calc(100% - 24px); font-size: 12.5px; font-weight: 600; color: #fff; background: rgba(40,14,22,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.bn-dots { position: absolute; right: 10px; bottom: 14px; display: flex; gap: 6px; }
.bn-dots button { width: 7px; height: 7px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.55); cursor: pointer; }
.bn-dots button[aria-current] { background: #fff; width: 18px; border-radius: 4px; }
@media (min-width: 700px) { .bn-slide { aspect-ratio: 3 / 1; } }
.home:has(.banner) { padding-top: 8px; gap: 18px; }
.popup { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(20,10,14,.55); }
.popup-karte { background: var(--surface); color: var(--fg); border: 1px solid var(--accent); border-radius: 16px; padding: 20px 20px 16px; max-width: 420px; width: 100%; display: grid; gap: 12px; line-height: 1.55; box-shadow: 0 12px 40px rgba(0,0,0,.35); max-height: calc(100dvh - 32px); overflow-y: auto; }
.popup-karte h2 { margin: 0; text-transform: none; letter-spacing: normal; font-size: 19px; color: var(--accent); line-height: 1.3; }
.popup-karte p { margin: 0; }
.popup-karte .spendenknopf { display: block; text-align: center; text-decoration: none; padding: 13px 16px; }
.popup-karte .linkbtn { justify-self: center; padding: 8px 12px; }

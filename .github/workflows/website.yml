# Baut die Web-App und veröffentlicht sie auf GitHub Pages.
# - Zeitplan (alle 6 Stunden) und manueller Start: Abgleich aller aktiven Quellen, dann neu bauen.
# - Push auf den Standard-Branch: Prüfen und mit dem zuletzt abgeglichenen Datenstand neu bauen.
name: Website

on:
  push:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      abgleich:
        description: 'Daten neu abgleichen'
        type: boolean
        default: true
      quellen:
        description: 'Nur diese Quellen abgleichen (IDs aus data/endpoints.json, durch Leerzeichen getrennt; leer = alle aktiven)'
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write      # Warn-Issue bei auffälligen Quellen (E-Mail über GitHub)

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Letzten Datenstand holen
        id: db
        uses: actions/cache/restore@v4
        with:
          path: data/ratsblick.sqlite
          key: ratsblick-db-${{ github.run_id }}
          restore-keys: ratsblick-db-

      # Bei Pushes nur abgleichen, wenn noch kein Datenstand existiert. Höchstens 1 Anfrage/Sekunde je Server.
      - name: Abgleich mit den Ratsinformationssystemen
        id: sync
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.abgleich) ||
          steps.db.outputs.cache-matched-key == ''
        continue-on-error: true
        # Eigene Zeitgrenze, damit Sichern und Veröffentlichen immer stattfinden; das Budget sorgt dafür,
        # dass nach 50 min keine neue Quelle mehr beginnt (Rest im nächsten Lauf, älteste zuerst).
        timeout-minutes: 75
        env:
          # Weiterleiter in Frankfurt für Server, die nur aus Europa erreichbar sind (relay/README.md)
          RATSBLICK_RELAY_URL: ${{ vars.RATSBLICK_RELAY_URL }}
          RATSBLICK_RELAY_SCHLUESSEL: ${{ secrets.RATSBLICK_RELAY_SCHLUESSEL }}
          QUELLEN: ${{ inputs.quellen }}
        run: |
          args=()
          for q in $QUELLEN; do args+=(--id "$q"); done
          npm run sync -- --budget-min 50 "${args[@]}"

      # Nach einem Abbruch können Änderungen noch im Write-Ahead-Log stehen; in die Datenbank übernehmen
      - name: Datenbank abschließen
        if: steps.sync.outcome != 'skipped'
        run: node -e "new (require('node:sqlite').DatabaseSync)('data/ratsblick.sqlite').exec('PRAGMA wal_checkpoint(TRUNCATE)')"

      - name: Datenstand sichern
        if: steps.sync.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: data/ratsblick.sqlite
          key: ratsblick-db-${{ github.run_id }}

      - name: Quellenstatus auswerten
        run: npm run status -- --warnungen warnungen.md

      - run: npm run web -- --out dist

      # Verschlüsseltes Dashboard unter /admin/ (Passwort im Secret ADMIN_PASSWORT; ohne Secret wird nichts erzeugt)
      - name: Admin-Dashboard
        env:
          ADMIN_PASSWORT: ${{ secrets.ADMIN_PASSWORT }}
          # Zugriffszahlen (optional): Variable ZAEHLER_URL (Adresse des Workers, siehe zaehler/README.md), Secret ZAEHLER_LESETOKEN
          ZAEHLER_URL: ${{ vars.ZAEHLER_URL }}
          ZAEHLER_LESETOKEN: ${{ secrets.ZAEHLER_LESETOKEN }}
        run: npm run admin -- --out dist/admin

      # Auffälligkeiten (Fehler, veraltet, leer, Einbruch) als Issue: GitHub schickt dir dazu eine E-Mail.
      # Neues Issue bei erster Auffälligkeit, Kommentar bei Änderung, Schließen wenn wieder alles in Ordnung ist.
      - name: Warnung per Issue
        if: steps.sync.outcome != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create quellenstatus --color B60205 --description "Automatische Warnung zum Quellenstatus" 2>/dev/null || true
          nr=$(gh issue list --label quellenstatus --state open --json number --jq '.[0].number // empty')
          if [ -s warnungen.md ]; then
            neu=$(head -1 warnungen.md | tr -d '\r')
            if [ -z "$nr" ]; then
              gh issue create --label quellenstatus --title "Quellenstatus: Auffälligkeiten" --body-file warnungen.md
            else
              alt=$(gh issue view "$nr" --json body --jq .body | head -1 | tr -d '\r')
              if [ "$alt" != "$neu" ]; then
                gh issue edit "$nr" --body-file warnungen.md
                gh issue comment "$nr" --body "Die Auffälligkeiten haben sich geändert – aktuelle Liste in der Beschreibung."
              fi
            fi
          elif [ -n "$nr" ]; then
            gh issue close "$nr" --comment "Alle Quellen sind wieder in Ordnung."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Nur der Standard-Branch wird veröffentlicht (Zeitplan läuft immer dort).
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

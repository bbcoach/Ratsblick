name: Zähler veröffentlichen

# Veröffentlicht den eigenen Seitenaufruf-Zähler (Cloudflare Worker + D1). Läuft nur bei Änderungen in zaehler/ oder von Hand.
# Braucht die Secrets CLOUDFLARE_API_TOKEN (nur Workers + D1), CLOUDFLARE_ACCOUNT_ID und ZAEHLER_LESETOKEN; siehe zaehler/README.md.
on:
  workflow_dispatch:
  push:
    branches: [claude/claude-md-local-server-isuhhi]
    paths: ['zaehler/**', '.github/workflows/deploy-zaehler.yml']

concurrency:
  group: deploy-zaehler

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.ZAEHLER_AKTIV == 'ja' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: zaehler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Datenbank anlegen oder finden
        run: |
          npx --yes wrangler@3 d1 create wahlheimat-zaehler || true
          ID=$(npx --yes wrangler@3 d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s.slice(s.indexOf("[")));const d=l.find(x=>x.name==="wahlheimat-zaehler");console.log(d?d.uuid:"")})')
          test -n "$ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
      - name: Tabelle anlegen
        run: npx --yes wrangler@3 d1 execute wahlheimat-zaehler --remote --file=schema.sql
      - name: Worker veröffentlichen
        run: npx --yes wrangler@3 deploy
      - name: Lese-Token setzen
        env:
          LESE_TOKEN: ${{ secrets.ZAEHLER_LESETOKEN }}
        run: printf '%s' "$LESE_TOKEN" | tr -d '[:space:]' | npx --yes wrangler@3 secret put LESE_TOKEN
